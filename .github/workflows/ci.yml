name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build StormFabric loader
        run: .\build.bat
        shell: cmd

      - name: Build example mods
        run: .\examples\build_examples.bat
        shell: cmd

      - name: Run offline test suite
        run: .\tests\run_tests.bat
        shell: cmd

      - name: Package Release Artifacts
        run: |
          mkdir release_pkg
          copy build\iphlpapi.dll release_pkg\
          mkdir release_pkg\mods\mc_lua_qol
          copy build\examples\mc_lua_qol\mc_lua_qol.dll release_pkg\mods\mc_lua_qol\
          copy build\examples\mc_lua_qol\mod.json release_pkg\mods\mc_lua_qol\
          powershell Compress-Archive -Path release_pkg\* -DestinationPath StormFabric-v0.1.0-alpha.zip
        shell: cmd

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StormFabric-v0.1.0-alpha
          path: StormFabric-v0.1.0-alpha.zip
