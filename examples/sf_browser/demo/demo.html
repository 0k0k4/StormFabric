<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StormFabric browser demo</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; font-family: "Segoe UI", system-ui, sans-serif; }
  .panel {
    box-sizing: border-box; position: absolute; inset: 8px; padding: 22px 26px;
    background: rgba(18, 24, 33, 0.92); color: #e8edf3; border-radius: 14px;
    border: 1px solid rgba(120, 170, 220, 0.35); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    display: flex; flex-direction: column; gap: 14px;
  }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  h1 small { font-size: 13px; color: #8fa6bd; font-weight: 400; margin-left: 8px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 14px; color: #e8edf3; background: #2c6db3; border: 0;
    border-radius: 8px; padding: 8px 16px; cursor: pointer;
  }
  button:hover { background: #3a82cf; }
  button.secondary { background: #3a4553; }
  button.secondary:hover { background: #4b5868; }
  input {
    font: inherit; font-size: 14px; flex: 1; min-width: 200px; color: #e8edf3; background: #0e141c;
    border: 1px solid #3a4553; border-radius: 8px; padding: 8px 10px;
  }
  input:focus { outline: 2px solid #3a82cf; border-color: transparent; }
  #log {
    flex: 1; overflow: auto; margin: 0; padding: 10px 12px; background: #0e141c; border-radius: 8px;
    font: 13px/1.5 Consolas, monospace; color: #b9c7d6; white-space: pre-wrap;
  }
  .hint { font-size: 12px; color: #8fa6bd; }
  canvas { border-radius: 8px; background: #0e141c; }
</style>
</head>
<body>
<div class="panel">
  <h1>Chromium in Stormworks <small id="ua"></small></h1>
  <div class="row">
    <button id="ping">Ping the mod</button>
    <button class="secondary" id="hide">Hide (F10 brings it back)</button>
    <canvas id="spin" width="120" height="36"></canvas>
  </div>
  <div class="row">
    <input id="url" value="https://example.org/" spellcheck="false">
    <button id="open">Open</button>
  </div>
  <pre id="log"></pre>
  <div class="hint">Click the page to type. Messages: page &rarr; mod with sfBrowser.send(), mod &rarr; page with sfBrowser.onmessage.</div>
</div>
<script>
  const log = (t) => { const el = document.getElementById('log'); el.textContent += t + '\n'; el.scrollTop = el.scrollHeight; };
  const bridge = () => window.sfBrowser;
  document.getElementById('ua').textContent = (navigator.userAgent.match(/Chrome\/[\d.]+/) || [''])[0];
  document.getElementById('ping').onclick = () => { if (bridge()) { bridge().send('ping'); log('> ping'); } };
  document.getElementById('hide').onclick = () => bridge() && bridge().send('hide');
  document.getElementById('open').onclick = () => {
    const url = document.getElementById('url').value.trim();
    if (url && bridge()) bridge().send('open:' + url);
  };
  document.getElementById('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('open').click(); });
  const ready = () => {
    if (!bridge()) return setTimeout(ready, 50);
    bridge().onmessage = (text) => log('< ' + text);
    log('bridge ready');
  };
  ready();
  // A small animation proves frames keep flowing.
  const c = document.getElementById('spin').getContext('2d');
  (function frame(t) {
    c.clearRect(0, 0, 120, 36);
    for (let i = 0; i < 8; i++) {
      const x = 12 + i * 13, y = 18 + Math.sin(t / 250 + i * 0.7) * 10;
      c.fillStyle = `hsl(${(t / 10 + i * 30) % 360} 70% 60%)`;
      c.beginPath(); c.arc(x, y, 4, 0, Math.PI * 2); c.fill();
    }
    requestAnimationFrame(frame);
  })(0);
</script>
</body>
</html>
